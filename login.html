<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSH Studio · Sign in</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <form class="login-card" method="post">
    <div class="brand big"><span class="mark">HSH</span><span class="brand-sub">Studio</span></div>
    <p class="muted">HDR editor for Home Sweet Home Productions</p>
    <label for="pw">Team password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button class="btn primary wide" type="submit">Sign in</button>
  </form>
</body>
</html>
